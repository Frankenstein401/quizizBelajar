<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <title>Bank Soal Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="data.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0e1a;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            margin: 0;
        }
        .font-arab { font-family: 'Amiri', serif; line-height: 2.4; font-size: 1.5rem; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.7); }
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes check-pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .anim-blob { animation: float 12s infinite ease-in-out; }
        .anim-delay-2 { animation-delay: 2s; }
        .anim-delay-4 { animation-delay: 4s; }
        .anim-enter { animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-fade { animation: fade-in 0.4s ease forwards; }
        .anim-check { animation: check-pop 0.3s ease forwards; }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glass-header {
            background: rgba(10, 14, 26, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .katex { font-size: 1.05em; color: inherit; }

        /* Multi-select checkbox */
        .multi-check {
            width: 22px; height: 22px;
            border: 2px solid rgba(148, 163, 184, 0.5);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .multi-check.selected {
            background: #6366f1;
            border-color: #6366f1;
        }
        .multi-check.correct-show {
            background: #22c55e;
            border-color: #22c55e;
        }
        .multi-check.wrong-show {
            background: #ef4444;
            border-color: #ef4444;
        }

        /* Match pill style */
        .match-pill {
            transition: all 0.2s;
            cursor: pointer;
        }
        .match-pill:hover { background: rgba(99, 102, 241, 0.15); }
        .match-pill.selected { 
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3);
        }
        .match-pill.correct-show {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
        }
        .match-pill.wrong-show {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
        }

        /* Type badge */
        .type-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── HELPERS ───
        const getQType = (q) => {
            if (q.type) return q.type;
            if (Array.isArray(q.correct)) return 'multi';
            if (typeof q.correct === 'string') return 'essay';
            if (!q.options || q.options.length === 0) return 'essay';
            return 'single';
        };

        const TYPE_LABELS = {
            single: { label: 'Pilihan Ganda', color: 'bg-indigo-500/20 text-indigo-300' },
            multi: { label: 'Multi Jawaban', color: 'bg-amber-500/20 text-amber-300' },
            match: { label: 'Menjodohkan', color: 'bg-emerald-500/20 text-emerald-300' },
            essay: { label: 'Esai', color: 'bg-rose-500/20 text-rose-300' },
        };

        // ─── BACKGROUND ───
        const BG = () => (
            <div className="fixed inset-0 -z-10 overflow-hidden" style={{background: 'linear-gradient(135deg, #0a0e1a 0%, #0f1629 50%, #0a0e1a 100%)'}}>
                <div className="absolute -top-48 -left-48 w-[500px] h-[500px] bg-indigo-600 rounded-full mix-blend-screen filter blur-[160px] opacity-20 anim-blob"></div>
                <div className="absolute -top-24 -right-24 w-[400px] h-[400px] bg-cyan-500 rounded-full mix-blend-screen filter blur-[140px] opacity-15 anim-blob anim-delay-2"></div>
                <div className="absolute -bottom-48 left-1/4 w-[450px] h-[450px] bg-fuchsia-600 rounded-full mix-blend-screen filter blur-[150px] opacity-15 anim-blob anim-delay-4"></div>
            </div>
        );

        // ─── ICONS ───
        const I = {
            Book: () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Activity: () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Check: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Trophy: () => <svg className="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            Redo: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>,
            Home: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Back: () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Arrow: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg>,
            Send: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
        };

        // ─── MATRIX PREPROCESSOR ───
        const convertMatrixToKatex = (matrixStr) => {
            try {
                const inner = matrixStr.slice(2, matrixStr.length - 2);
                const rows = inner.split(/\],\s*\[/);
                const matrix = rows.map(row => row.split(',').map(e => e.trim()));
                const katexRows = matrix.map(row => row.join(' & '));
                return `$\\begin{pmatrix}${katexRows.join(' \\\\ ')}\\end{pmatrix}$`;
            } catch(e) {
                return matrixStr;
            }
        };

        const preprocessText = (text) => {
            if (!text || typeof text !== 'string') return text;
            let result = '';
            let i = 0;
            while (i < text.length) {
                if (text[i] === '[' && i + 1 < text.length && text[i + 1] === '[') {
                    let depth = 0, j = i, endIdx = -1;
                    while (j < text.length) {
                        if (text[j] === '[') depth++;
                        else if (text[j] === ']') { depth--; if (depth === 0) { endIdx = j; break; } }
                        j++;
                    }
                    if (endIdx > -1) {
                        result += convertMatrixToKatex(text.slice(i, endIdx + 1));
                        i = endIdx + 1;
                    } else { result += text[i]; i++; }
                } else { result += text[i]; i++; }
            }
            return result;
        };

        // ─── MATH TEXT ───
        const MT = ({ text = "", className = "" }) => {
            const ref = useRef(null);
            const processed = preprocessText(String(text || ""));
            useEffect(() => {
                if (ref.current && window.renderMathInElement) {
                    window.renderMathInElement(ref.current, {
                        delimiters: [{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
                        throwOnError: false
                    });
                }
            }, [text]);
            if (!text) return null;
            return (
                <div ref={ref} className={className}>
                    {processed.split('\n').map((line, i) => {
                        const isAr = /[\u0600-\u06FF]/.test(line);
                        return <div key={i} className={isAr ? "font-arab text-2xl text-right my-2 leading-relaxed" : "mb-1 leading-relaxed"}
                            style={{overflowX:'auto'}}>{line}</div>
                    })}
                </div>
            );
        };

        // ═══════ SPLASH ═══════
        const Splash = ({ onDone }) => {
            useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, [onDone]);
            return (
                <div className="fixed inset-0 flex flex-col items-center justify-center z-50 p-6">
                    <div className="relative w-28 h-28 mb-8">
                        <div className="absolute inset-0 bg-indigo-500 rounded-full blur-2xl opacity-40 animate-pulse"></div>
                        <div className="relative w-full h-full glass rounded-3xl flex items-center justify-center text-indigo-300 border border-indigo-400/20" style={{animation:'glow-pulse 2.5s infinite'}}>
                            <div className="w-14 h-14"><I.Book /></div>
                        </div>
                    </div>
                    <h1 className="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 via-white to-cyan-200 anim-enter">Bank Soal</h1>
                    <p className="text-sm text-indigo-300/70 font-medium mt-2 anim-enter" style={{animationDelay:'0.1s'}}>Persiapan Ujian Sekolah</p>
                    <div className="mt-10 flex gap-2">
                        {[0,1,2].map(i => <div key={i} className="w-2.5 h-2.5 bg-indigo-400 rounded-full animate-bounce" style={{animationDelay:`${i*0.1}s`}}/>)}
                    </div>
                </div>
            );
        };

        // ═══════ SUBJECT MENU ═══════
        const SubjectMenu = ({ onSelect }) => {
            const subs = Object.keys(window.QUIZ_DATABASE);
            return (
                <div className="min-h-screen p-5 flex flex-col items-center max-w-lg mx-auto anim-enter">
                    <header className="w-full mb-8 mt-6">
                        <p className="text-xs font-bold text-indigo-400 uppercase tracking-[0.2em] mb-1">Selamat Datang</p>
                        <h1 className="text-2xl font-bold text-white">Mau belajar apa hari ini?</h1>
                    </header>
                    <div className="w-full space-y-4">
                        {subs.map((k, i) => {
                            const s = window.QUIZ_DATABASE[k];
                            const Ic = I[s.icon] || I.Book;
                            const totalQ = Object.values(s.chapters).reduce((a,c) => a + c.questions.length, 0);
                            return (
                                <button key={k} onClick={() => onSelect(k)}
                                    className="w-full glass rounded-2xl p-5 flex items-center gap-4 group transition-all duration-200 active:scale-[0.98] hover:bg-white/[0.06]"
                                    style={{animationDelay:`${i*0.08}s`}}>
                                    <div className={`w-14 h-14 rounded-xl flex items-center justify-center text-white shadow-lg bg-gradient-to-br ${s.color} shrink-0`}>
                                        <div className="w-7 h-7"><Ic /></div>
                                    </div>
                                    <div className="text-left flex-1 min-w-0">
                                        <h3 className="text-base font-bold text-white truncate group-hover:text-indigo-200 transition-colors">{s.label}</h3>
                                        <p className="text-xs text-slate-500 mt-0.5">{Object.keys(s.chapters).length} Bab · {totalQ} Soal</p>
                                    </div>
                                    <div className="text-slate-600 group-hover:text-indigo-400 transition-colors"><I.Arrow /></div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ═══════ CHAPTER MENU ═══════
        const ChapterMenu = ({ subKey, onStart, onBack }) => {
            const sub = window.QUIZ_DATABASE[subKey];
            const chaps = Object.keys(sub.chapters);
            return (
                <div className="min-h-screen p-5 flex flex-col items-center max-w-lg mx-auto anim-enter">
                    <header className="w-full mb-6 mt-3 flex items-center gap-3">
                        <button onClick={onBack} className="p-2.5 glass rounded-xl text-white hover:bg-white/10 transition-all"><I.Back /></button>
                        <div>
                            <p className="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.15em]">Mata Pelajaran</p>
                            <h1 className="font-bold text-xl text-white">{sub.label}</h1>
                        </div>
                    </header>
                    <div className="w-full space-y-3">
                        {chaps.map((cn, i) => {
                            const d = sub.chapters[cn];
                            const types = [...new Set(d.questions.map(q => getQType(q)))];
                            return (
                                <button key={cn} onClick={() => onStart(cn)}
                                    className="w-full text-left glass rounded-2xl p-5 relative overflow-hidden group transition-all duration-200 active:scale-[0.98] hover:bg-white/[0.06]"
                                    style={{animationDelay:`${i*0.07}s`}}>
                                    <div className="flex justify-between items-start mb-2">
                                        <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gradient-to-r ${sub.color} text-white`}>BAB {cn}</span>
                                        <span className="text-[11px] text-slate-500 font-medium">{d.questions.length} Soal</span>
                                    </div>
                                    <h3 className="text-base font-bold text-white mb-1">{d.title}</h3>
                                    <p className="text-slate-500 text-xs line-clamp-1 mb-2.5">{d.desc}</p>
                                    <div className="flex gap-1.5 flex-wrap">
                                        {types.map(t => {
                                            const tl = TYPE_LABELS[t] || TYPE_LABELS.single;
                                            return <span key={t} className={`type-badge ${tl.color}`}>{tl.label}</span>;
                                        })}
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ═══════ QUIZ GAME (supports single / multi / match / essay) ═══════
        const Quiz = ({ subKey, chapId, onComplete, onHome }) => {
            const data = window.QUIZ_DATABASE[subKey].chapters[chapId];
            const color = window.QUIZ_DATABASE[subKey].color;
            const qs = data.questions;

            const [idx, setIdx] = useState(0);
            const [locked, setLocked] = useState(false);
            const [score, setScore] = useState(0);
            const [answers, setAnswers] = useState([]);
            // single
            const [selSingle, setSelSingle] = useState(null);
            // multi
            const [selMulti, setSelMulti] = useState([]);
            // match
            const [selMatch, setSelMatch] = useState(null);
            // essay
            const [essayText, setEssayText] = useState('');

            const q = qs[idx];
            const qType = getQType(q);

            const resetSel = () => { setSelSingle(null); setSelMulti([]); setSelMatch(null); setEssayText(''); };

            const advance = (isCor, uAns) => {
                if (isCor) setScore(s => s + 1);
                const newAns = [...answers, { qId: q.id, uAns, isCor, type: qType }];
                setAnswers(newAns);
                setTimeout(() => {
                    if (idx < qs.length - 1) { setIdx(i => i + 1); setLocked(false); resetSel(); }
                    else { onComplete(score + (isCor ? 1 : 0), newAns); }
                }, 1800);
            };

            // ── SINGLE handler
            const handleSingle = (i) => {
                if (locked) return;
                if (navigator.vibrate) navigator.vibrate(30);
                setSelSingle(i); setLocked(true);
                advance(i === q.correct, i);
            };

            // ── MULTI handler
            const toggleMulti = (i) => {
                if (locked) return;
                if (navigator.vibrate) navigator.vibrate(20);
                setSelMulti(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i]);
            };
            const submitMulti = () => {
                if (locked || selMulti.length === 0) return;
                setLocked(true);
                const sorted = [...selMulti].sort();
                const correctSorted = [...q.correct].sort();
                const isCor = JSON.stringify(sorted) === JSON.stringify(correctSorted);
                advance(isCor, selMulti);
            };

            // ── MATCH handler
            const handleMatch = (i) => {
                if (locked) return;
                if (navigator.vibrate) navigator.vibrate(30);
                setSelMatch(i); setLocked(true);
                advance(i === q.correct, i);
            };

            // ── ESSAY handler
            const submitEssay = () => {
                if (locked) return;
                setLocked(true);
                // Essays always count as correct (self-check)
                advance(true, essayText);
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto">
                    {/* HEADER */}
                    <div className="glass-header sticky top-0 z-20 px-5 py-3.5">
                        <div className="flex justify-between items-center mb-3">
                            <button onClick={onHome} className="p-1.5 text-slate-400 hover:text-white transition-colors"><I.Back /></button>
                            <div className="flex items-center gap-3">
                                {qType !== 'single' && <span className={`type-badge ${(TYPE_LABELS[qType]||TYPE_LABELS.single).color}`}>{(TYPE_LABELS[qType]||TYPE_LABELS.single).label}</span>}
                                <span className="text-sm font-bold text-white">{idx + 1}<span className="text-slate-600">/{qs.length}</span></span>
                            </div>
                        </div>
                        <div className="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                            <div className={`h-full bg-gradient-to-r ${color} transition-all duration-500 ease-out`} style={{width:`${((idx+1)/qs.length)*100}%`}}/>
                        </div>
                    </div>

                    {/* CONTENT */}
                    <div key={idx} className="flex-1 p-5 pb-28 overflow-y-auto no-scrollbar anim-enter">
                        {/* Question */}
                        <div className="glass rounded-2xl p-5 mb-5 border border-white/5">
                            <MT text={q.text} className="text-[15px] font-medium text-slate-200 leading-relaxed" />
                        </div>

                        {/* ── SINGLE ── */}
                        {qType === 'single' && (
                            <div className="space-y-2.5">
                                {q.options.map((opt, i) => {
                                    let cls = "bg-white/[0.03] border-white/[0.07] text-slate-300";
                                    if (locked) {
                                        if (i === q.correct) cls = "bg-emerald-500/15 border-emerald-500/60 text-emerald-200";
                                        else if (i === selSingle) cls = "bg-red-500/15 border-red-500/60 text-red-300";
                                        else cls = "opacity-25 border-transparent";
                                    }
                                    return (
                                        <button key={i} onClick={() => handleSingle(i)} disabled={locked}
                                            className={`w-full p-4 rounded-xl text-left border transition-all duration-200 active:scale-[0.98] flex gap-3 items-center ${cls}`}>
                                            <div className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-[11px] border transition-all shrink-0 ${
                                                locked && i === q.correct ? "bg-emerald-500 border-emerald-500 text-white anim-check" :
                                                locked && i === selSingle ? "bg-red-500 border-red-500 text-white" :
                                                "border-slate-600/50 text-slate-500"
                                            }`}>
                                                {locked && i === q.correct ? <I.Check /> : locked && i === selSingle ? <I.X /> : ["A","B","C","D","E"][i]}
                                            </div>
                                            <MT text={opt} className="text-sm flex-1" />
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* ── MULTI ── */}
                        {qType === 'multi' && (
                            <div>
                                <p className="text-xs text-indigo-400 font-semibold mb-3 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 bg-indigo-400 rounded-full"></span>
                                    Pilih semua jawaban yang benar, lalu tekan Kirim
                                </p>
                                <div className="space-y-2.5">
                                    {q.options.map((opt, i) => {
                                        const isSel = selMulti.includes(i);
                                        const isCorrectOpt = q.correct.includes(i);
                                        let cls = "bg-white/[0.03] border-white/[0.07] text-slate-300";
                                        let checkCls = "";
                                        if (locked) {
                                            if (isCorrectOpt) { cls = "bg-emerald-500/15 border-emerald-500/60 text-emerald-200"; checkCls = "correct-show"; }
                                            else if (isSel && !isCorrectOpt) { cls = "bg-red-500/15 border-red-500/60 text-red-300"; checkCls = "wrong-show"; }
                                            else { cls = "opacity-25 border-transparent"; }
                                        } else if (isSel) {
                                            cls = "bg-indigo-500/10 border-indigo-500/40 text-indigo-200";
                                            checkCls = "selected";
                                        }
                                        return (
                                            <button key={i} onClick={() => toggleMulti(i)} disabled={locked}
                                                className={`w-full p-4 rounded-xl text-left border transition-all duration-200 active:scale-[0.98] flex gap-3 items-center ${cls}`}>
                                                <div className={`multi-check ${checkCls}`}>
                                                    {(isSel || (locked && isCorrectOpt)) && <I.Check />}
                                                </div>
                                                <MT text={opt} className="text-sm flex-1" />
                                            </button>
                                        );
                                    })}
                                </div>
                                {!locked && (
                                    <button onClick={submitMulti} disabled={selMulti.length === 0}
                                        className={`w-full mt-4 py-3.5 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${
                                            selMulti.length > 0
                                                ? 'bg-indigo-600 text-white hover:bg-indigo-500 active:scale-[0.98] shadow-lg shadow-indigo-500/20'
                                                : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                                        }`}>
                                        <I.Send /> Kirim Jawaban ({selMulti.length} dipilih)
                                    </button>
                                )}
                            </div>
                        )}

                        {/* ── MATCH ── */}
                        {qType === 'match' && (
                            <div>
                                <p className="text-xs text-emerald-400 font-semibold mb-3 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>
                                    Pilih jawaban yang tepat untuk dijodohkan
                                </p>
                                <div className="space-y-2.5">
                                    {q.options.map((opt, i) => {
                                        let cls = "match-pill border border-white/[0.07] bg-white/[0.03] text-slate-300";
                                        if (locked) {
                                            if (i === q.correct) cls = "match-pill correct-show border text-emerald-200";
                                            else if (i === selMatch) cls = "match-pill wrong-show border text-red-300";
                                            else cls = "match-pill opacity-25 border border-transparent";
                                        } else if (i === selMatch) {
                                            cls = "match-pill selected border";
                                        }
                                        return (
                                            <button key={i} onClick={() => handleMatch(i)} disabled={locked}
                                                className={`w-full p-4 rounded-xl text-left transition-all duration-200 active:scale-[0.98] flex gap-3 items-center ${cls}`}>
                                                <div className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-[11px] border transition-all shrink-0 ${
                                                    locked && i === q.correct ? "bg-emerald-500 border-emerald-500 text-white anim-check" :
                                                    locked && i === selMatch ? "bg-red-500 border-red-500 text-white" :
                                                    "border-slate-600/50 text-slate-500"
                                                }`}>
                                                    {locked && i === q.correct ? <I.Check /> : locked && i === selMatch ? <I.X /> : ["A","B","C","D","E"][i]}
                                                </div>
                                                <span className="text-sm font-medium flex-1">{opt}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ── ESSAY ── */}
                        {qType === 'essay' && (
                            <div>
                                <p className="text-xs text-rose-400 font-semibold mb-3">Tuliskan jawabanmu di bawah ini:</p>
                                <textarea
                                    value={essayText} onChange={e => setEssayText(e.target.value)}
                                    disabled={locked} rows={5} placeholder="Ketik jawaban..."
                                    className="w-full bg-white/[0.04] border border-white/10 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500/50 resize-none transition-colors"
                                />
                                {locked && (
                                    <div className="mt-3 glass rounded-xl p-4 border border-emerald-500/20 anim-fade">
                                        <p className="text-xs font-bold text-emerald-400 mb-1.5">Kunci Jawaban:</p>
                                        <MT text={String(q.correct)} className="text-sm text-slate-300" />
                                    </div>
                                )}
                                {!locked && (
                                    <button onClick={submitEssay}
                                        className="w-full mt-3 py-3.5 rounded-xl font-bold text-sm bg-indigo-600 text-white hover:bg-indigo-500 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                                        <I.Send /> Lihat Kunci Jawaban
                                    </button>
                                )}
                            </div>
                        )}

                        {/* Explanation overlay when locked */}
                        {locked && qType !== 'essay' && (
                            <div className="mt-4 glass rounded-xl p-4 border border-indigo-500/10 anim-fade">
                                <p className="text-xs font-bold text-indigo-400 mb-1">Pembahasan:</p>
                                <MT text={q.explanation} className="text-xs text-slate-400 leading-relaxed" />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ═══════ RESULT SCREEN ═══════
        const Result = ({ score, subKey, chapId, answers, onRetry, onHome }) => {
            const data = window.QUIZ_DATABASE[subKey].chapters[chapId];
            const qs = data.questions;
            const pct = Math.round((score / qs.length) * 100);

            useEffect(() => {
                if (pct === 100) {
                    const c = new JSConfetti();
                    c.addConfetti({ emojis: ['🏆','⭐','✨'], confettiNumber: 40 });
                }
            }, [pct]);

            let title = "Jangan Menyerah!", sub = "Setiap kesalahan adalah pelajaran.";
            let gc = "text-slate-400";
            if (pct === 100) { title = "Sempurna!"; sub = "Kamu menguasai materi ini!"; gc = "text-yellow-400"; }
            else if (pct >= 80) { title = "Luar Biasa!"; sub = "Sedikit lagi sempurna."; gc = "text-emerald-400"; }
            else if (pct >= 60) { title = "Bagus!"; sub = "Tingkatkan lagi belajarmu."; gc = "text-indigo-400"; }

            return (
                <div className="min-h-screen p-5 max-w-lg mx-auto anim-enter">
                    {/* Score */}
                    <div className="glass rounded-2xl p-7 text-center mb-6">
                        <div className="w-20 h-20 mx-auto bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-white mb-5 shadow-lg" style={{animation:'glow-pulse 3s infinite'}}>
                            <div className="w-10 h-10"><I.Trophy /></div>
                        </div>
                        <h2 className={`text-2xl font-extrabold mb-1 ${gc}`}>{title}</h2>
                        <p className="text-slate-500 text-xs mb-5">{sub}</p>
                        <div className="flex justify-center items-end gap-1.5 mb-6">
                            <span className="text-5xl font-black text-white tracking-tighter">{score}</span>
                            <span className="text-lg text-slate-600 font-medium mb-1">/ {qs.length}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={onRetry} className="bg-white text-slate-900 py-3 rounded-xl font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg">
                                <I.Redo /> Ulangi
                            </button>
                            <button onClick={onHome} className="bg-white/10 text-white py-3 rounded-xl font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                                <I.Home /> Menu
                            </button>
                        </div>
                    </div>

                    {/* Review */}
                    <h3 className="text-base font-bold text-white mb-3 px-1">Pembahasan</h3>
                    <div className="space-y-3 pb-12">
                        {qs.map((q, i) => {
                            const a = answers.find(x => x.qId === q.id);
                            const qt = getQType(q);
                            const isCor = a?.isCor;
                            const tl = TYPE_LABELS[qt] || TYPE_LABELS.single;

                            return (
                                <div key={q.id} className="glass rounded-xl p-4 border border-white/5">
                                    <div className="flex gap-2.5 mb-2.5">
                                        <div className={`w-5 h-5 rounded-md flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5 ${isCor ? 'bg-emerald-500 text-black' : 'bg-red-500 text-white'}`}>{i+1}</div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center gap-1.5 mb-1">
                                                <span className={`type-badge ${tl.color}`} style={{fontSize:'8px',padding:'1px 6px'}}>{tl.label}</span>
                                            </div>
                                            <MT text={q.text} className="text-xs font-medium text-slate-300 line-clamp-3" />
                                        </div>
                                    </div>

                                    <div className="bg-black/20 rounded-lg p-3 text-[11px] space-y-1.5">
                                        {/* Show answer based on type */}
                                        {qt === 'single' || qt === 'match' ? (
                                            <>
                                                <div className="flex gap-1.5">
                                                    <span className="text-slate-600 w-11 shrink-0">Kamu:</span>
                                                    <span className={`font-bold ${isCor ? 'text-emerald-400' : 'text-red-400'}`}>
                                                        {q.options && q.options[a?.uAns] ? q.options[a.uAns] : "-"}
                                                    </span>
                                                </div>
                                                {!isCor && (
                                                    <div className="flex gap-1.5">
                                                        <span className="text-slate-600 w-11 shrink-0">Kunci:</span>
                                                        <span className="text-emerald-400 font-bold">{q.options[q.correct]}</span>
                                                    </div>
                                                )}
                                            </>
                                        ) : qt === 'multi' ? (
                                            <>
                                                <div className="flex gap-1.5">
                                                    <span className="text-slate-600 w-11 shrink-0">Kamu:</span>
                                                    <span className={`font-bold ${isCor ? 'text-emerald-400' : 'text-red-400'}`}>
                                                        {Array.isArray(a?.uAns) ? a.uAns.map(x => q.options[x]).join(', ') : '-'}
                                                    </span>
                                                </div>
                                                {!isCor && (
                                                    <div className="flex gap-1.5">
                                                        <span className="text-slate-600 w-11 shrink-0">Kunci:</span>
                                                        <span className="text-emerald-400 font-bold">{q.correct.map(x => q.options[x]).join(', ')}</span>
                                                    </div>
                                                )}
                                            </>
                                        ) : (
                                            <div>
                                                <span className="text-slate-600">Kunci: </span>
                                                <span className="text-emerald-400 font-bold">{String(q.correct)}</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-2.5 pt-2.5 border-t border-white/5">
                                        <div className="flex gap-1.5 text-[11px] leading-relaxed text-slate-500">
                                            <span className="text-indigo-400 font-bold shrink-0">Info:</span>
                                            <MT text={q.explanation} />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // ═══════ APP ═══════
        const App = () => {
            const [scr, setScr] = useState('splash');
            const [sub, setSub] = useState(null);
            const [chap, setChap] = useState(null);
            const [res, setRes] = useState(null);

            const goHome = () => { setSub(null); setChap(null); setScr('subject'); };

            return (
                <>
                    <BG />
                    {scr === 'splash' && <Splash onDone={() => setScr('subject')} />}
                    {scr === 'subject' && <SubjectMenu onSelect={s => { setSub(s); setScr('chapter'); }} />}
                    {scr === 'chapter' && <ChapterMenu subKey={sub} onStart={c => { setChap(c); setScr('quiz'); }} onBack={() => { setSub(null); setScr('subject'); }} />}
                    {scr === 'quiz' && <Quiz subKey={sub} chapId={chap} onComplete={(s,a) => { setRes({s,a}); setScr('result'); }} onHome={goHome} />}
                    {scr === 'result' && <Result score={res.s} answers={res.a} subKey={sub} chapId={chap} onRetry={() => setScr('quiz')} onHome={goHome} />}
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
